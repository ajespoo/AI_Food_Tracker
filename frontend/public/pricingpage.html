<!-- Pricing Page -->
<h2>Pricing</h2>
<p>Choose your subscription plan</p>

<div>
    <h3>Yearly Subscription</h3>
    <p>Access for 12 months</p>
    <p>Price: 45 Euros</p>
    <button id="yearlySubscriptionBtn">Subscribe Yearly</button>
</div>

<div>
    <h3>Weekly Access</h3>
    <p>Access for 1 week</p>
    <p>Price: 4.99 Euros</p>
    <button id="weeklySubscriptionBtn">Subscribe Weekly</button>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe('your-stripe-public-key');  // Your Stripe public key

    document.getElementById('yearlySubscriptionBtn').addEventListener('click', async () => {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ plan: 'yearly' }),  // Indicating the plan selected
        });

        const session = await response.json();

        // Redirect to Stripe checkout page
        const { sessionId } = session;
        stripe.redirectToCheckout({ sessionId });
    });

    document.getElementById('weeklySubscriptionBtn').addEventListener('click', async () => {
        const response = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ plan: 'weekly' }),  // Indicating the plan selected
        });

        const session = await response.json();

        // Redirect to Stripe checkout page
        const { sessionId } = session;
        stripe.redirectToCheckout({ sessionId });
    });
</script>
